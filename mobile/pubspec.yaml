name: citizen_alert_ghana
description: "CitizenAlert Ghana — National Civic Safety & Emergency Response Mobile Client"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Camera & Media
  camera: ^0.10.5+9
  video_player: ^2.8.6
  image_picker: ^1.1.1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Cryptography & Security
  crypto: ^3.0.3
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0

  # Offline Storage & Database
  sqflite: ^2.3.3+1

  # Location & Geocoding
  geolocator: ^11.0.0
  intl: ^0.19.0

  # Networking & Chunked Uploads
  dio: ^5.4.3+1
  connectivity_plus: ^5.0.2

  # UI & Icons
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/lang/

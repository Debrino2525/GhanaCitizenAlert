services:
  # -------------------------------------------------------------
  # 1. Core NestJS Backend API Web Service
  # -------------------------------------------------------------
  - type: web
    name: ghana-citizen-alert-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /v1/incidents
    envVars:
      - key: NODE_ENV
        value: production
      - key: GHANAPOST_ADAPTER_DRIVER
        value: mock
      - key: NIA_ADAPTER_DRIVER
        value: mock
      - key: SMS_ADAPTER_DRIVER
        value: mock
      - key: CELL_BROADCAST_ADAPTER_DRIVER
        value: mock
      - key: CAD_DISPATCH_ADAPTER_DRIVER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: citizen-alert-db
          property: connectionString

# -------------------------------------------------------------
# 2. Managed PostgreSQL + PostGIS Database on Render
# -------------------------------------------------------------
databases:
  - name: citizen-alert-db
    plan: free
    databaseName: citizen_alert_ghana
    user: alert_admin
